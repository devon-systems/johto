{{- $name := required "app.name is required" .Values.app.name }}
{{- $port := required "app.port is required" .Values.app.port }}
{{- $image := required "app.image is required" .Values.app.image }}
{{- $databaseSecretName := required "database.secretName is required" .Values.database.secretName }}
{{- $mainDatabase := required "database.mainDatabase is required" .Values.database.mainDatabase }}
{{- $legacyConfigPath := required "legacyConfig.path is required" .Values.legacyConfig.path }}
{{- $legacyConfigFormat := required "legacyConfig.format is required" .Values.legacyConfig.format }}
{{- $exporterEnabled := .Values.exporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  # Each application has one writable config volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        security.aly.codes/exception-host-path: Library, download, archive, and legacy import paths use Goldenrod's existing filesystems.
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      initContainers:
        - name: wait-for-postgres
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          image: {{ required "database.clientImage is required" .Values.database.clientImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # Flux dependencies do not order pod startup after a node reboot.
              until psql -X -w -q --dbname={{ $mainDatabase | quote }} --command="SELECT 1" >/dev/null{{ if .Values.database.logDatabase }} && psql -X -w -q --dbname={{ .Values.database.logDatabase | quote }} --command="SELECT 1" >/dev/null{{ end }}; do
                echo "Waiting for PostgreSQL databases to accept authenticated queries"
                sleep 5
              done
          env:
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: {{ $databaseSecretName }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ $databaseSecretName }}
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: {{ $databaseSecretName }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ $databaseSecretName }}
        - name: prepare-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          image: docker.io/library/busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -z "$(find /config -mindepth 1 -print -quit)" ]; then
                cp -a /legacy/. /config/
              fi

              chown -R 911:911 /config
          volumeMounts:
            - name: config
              mountPath: /config
            - name: legacy-config
              mountPath: /legacy
              readOnly: true
      {{- if $exporterEnabled }}
        - name: prepare-exporter-api-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          image: docker.io/library/busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- if eq $legacyConfigFormat "xml" }}
              api_key="$(sed -n 's:.*<ApiKey>\([^<]*\)</ApiKey>.*:\1:p' /config-read/config.xml)"
              {{- else if eq $legacyConfigFormat "yaml" }}
              api_key="$(sed -n 's/^[[:space:]]*apikey:[[:space:]]*//p' /config-read/config/config.yaml | head -n 1 | tr -d '\"')"
              {{- end }}
              test -n "$api_key"
              printf %s "$api_key" > /run/exportarr/api-key
          volumeMounts:
            - name: config
              mountPath: /config-read
              readOnly: true
            - name: exporter-api-key
              mountPath: /run/exportarr
      {{- end }}
      containers:
        - name: {{ $name }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          image: {{ $image | quote }}
          env:
            - name: PGID
              value: "100"
            - name: PUID
              value: "911"
            - name: TZ
              value: America/New_York
            - name: UMASK
              value: "002"
            {{- if eq $name "bazarr" }}
            - name: POSTGRES_ENABLED
              value: "true"
            - name: POSTGRES_DATABASE
              value: {{ $mainDatabase | quote }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: {{ $databaseSecretName }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ $databaseSecretName }}
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: {{ $databaseSecretName }}
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ $databaseSecretName }}
            {{- else }}
            - name: {{ $name | upper }}__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: {{ $databaseSecretName }}
            - name: {{ $name | upper }}__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: {{ $databaseSecretName }}
            - name: {{ $name | upper }}__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ $databaseSecretName }}
            - name: {{ $name | upper }}__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ $databaseSecretName }}
            - name: {{ $name | upper }}__POSTGRES__MAINDB
              value: {{ $mainDatabase | quote }}
            - name: {{ $name | upper }}__POSTGRES__LOGDB
              value: {{ .Values.database.logDatabase | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $port }}
              name: http
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /mnt/Media
            - name: data
              mountPath: /data
            - name: backblaze
              mountPath: /mnt/Backblaze
        {{- if $exporterEnabled }}
        - name: exporter
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          image: {{ required "exporter.image is required when exporter.enabled" .Values.exporter.image | quote }}
          args: [{{ $name | quote }}]
          env:
            - name: API_KEY_FILE
              value: /run/exportarr/api-key
            - name: PORT
              value: {{ .Values.exporter.port | quote }}
            - name: URL
              value: "http://127.0.0.1:{{ $port }}"
          ports:
            - containerPort: {{ .Values.exporter.port }}
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: exporter-api-key
              mountPath: /run/exportarr
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ $name }}-config
        - name: library
          hostPath:
            path: /mnt/Media
            type: Directory
        - name: data
          hostPath:
            path: /mnt/Data
            type: Directory
        - name: backblaze
          hostPath:
            path: /mnt/Backblaze
            type: Directory
        - name: legacy-config
          hostPath:
            path: {{ $legacyConfigPath }}
            type: Directory
        {{- if $exporterEnabled }}
        - name: exporter-api-key
          emptyDir: {}
        {{- end }}
