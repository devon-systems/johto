{{- $name := required "app.name is required" .Values.app.name }}
{{- $port := required "app.port is required" .Values.app.port }}
{{- $image := required "app.image is required" .Values.app.image }}
{{- $databaseSecretName := required "database.secretName is required" .Values.database.secretName }}
{{- $mainDatabase := required "database.mainDatabase is required" .Values.database.mainDatabase }}
{{- $legacyConfigPath := required "legacyConfig.path is required" .Values.legacyConfig.path }}
{{- $legacyConfigFormat := required "legacyConfig.format is required" .Values.legacyConfig.format }}
{{- $exporterEnabled := .Values.exporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      initContainers:
        - name: prepare-config
          image: docker.io/library/busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -z "$(find /config -mindepth 1 -print -quit)" ]; then
                cp -a /legacy/. /config/
              fi

              {{- if eq $legacyConfigFormat "xml" }}
              config_file=/config/config.xml
              sed -i '/<Postgres\(Host\|Port\|User\|Password\|MainDb\|LogDb\)>/d' "$config_file"
              sed -i "/<Config>/a\\  <PostgresLogDb>{{ .Values.database.logDatabase }}</PostgresLogDb>\\n  <PostgresMainDb>{{ $mainDatabase }}</PostgresMainDb>\\n  <PostgresPassword>${POSTGRES_PASSWORD}</PostgresPassword>\\n  <PostgresUser>${POSTGRES_USER}</PostgresUser>\\n  <PostgresPort>${POSTGRES_PORT}</PostgresPort>\\n  <PostgresHost>${POSTGRES_HOST}</PostgresHost>" "$config_file"
              {{- else if eq $legacyConfigFormat "yaml" }}
              config_file=/config/config/config.yaml
              awk -v database="{{ $mainDatabase }}" -v host="$POSTGRES_HOST" -v password="$POSTGRES_PASSWORD" -v port="$POSTGRES_PORT" -v user="$POSTGRES_USER" '
                /^postgresql:/ {
                  print "postgresql:"
                  print "  database: \047" database "\047"
                  print "  enabled: true"
                  print "  host: \047" host "\047"
                  print "  password: \047" password "\047"
                  print "  port: " port
                  print "  username: \047" user "\047"
                  in_postgresql = 1
                  next
                }
                in_postgresql && /^[^[:space:]]/ { in_postgresql = 0 }
                !in_postgresql { print }
              ' "$config_file" > "$config_file.next"
              mv "$config_file.next" "$config_file"
              {{- else }}
              echo "Unsupported legacy config format: {{ $legacyConfigFormat }}" >&2
              exit 1
              {{- end }}

              chown -R 911:911 /config
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: {{ $databaseSecretName }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ $databaseSecretName }}
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: {{ $databaseSecretName }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ $databaseSecretName }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: legacy-config
              mountPath: /legacy
              readOnly: true
      {{- if $exporterEnabled }}
        - name: prepare-exporter-api-key
          image: docker.io/library/busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- if eq $legacyConfigFormat "xml" }}
              api_key="$(sed -n 's:.*<ApiKey>\([^<]*\)</ApiKey>.*:\1:p' /config-read/config.xml)"
              {{- else if eq $legacyConfigFormat "yaml" }}
              api_key="$(sed -n 's/^[[:space:]]*apikey:[[:space:]]*//p' /config-read/config/config.yaml | head -n 1 | tr -d '\"')"
              {{- end }}
              test -n "$api_key"
              printf %s "$api_key" > /run/exportarr/api-key
          volumeMounts:
            - name: config
              mountPath: /config-read
              readOnly: true
            - name: exporter-api-key
              mountPath: /run/exportarr
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $image | quote }}
          env:
            - name: PGID
              value: "100"
            - name: PUID
              value: "911"
            - name: TZ
              value: America/New_York
            - name: UMASK
              value: "002"
            {{- if .Values.database.environment }}
            - name: POSTGRES_ENABLED
              value: "true"
            - name: POSTGRES_DATABASE
              value: {{ $mainDatabase | quote }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: {{ $databaseSecretName }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ $databaseSecretName }}
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: {{ $databaseSecretName }}
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ $databaseSecretName }}
            {{- end }}
          ports:
            - containerPort: {{ $port }}
              name: http
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /mnt/Media
            - name: data
              mountPath: /data
            - name: backblaze
              mountPath: /mnt/Backblaze
        {{- if $exporterEnabled }}
        - name: exporter
          image: {{ required "exporter.image is required when exporter.enabled" .Values.exporter.image | quote }}
          args: [{{ $name | quote }}]
          env:
            - name: API_KEY_FILE
              value: /run/exportarr/api-key
            - name: PORT
              value: {{ .Values.exporter.port | quote }}
            - name: URL
              value: "http://127.0.0.1:{{ $port }}"
          ports:
            - containerPort: {{ .Values.exporter.port }}
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: exporter-api-key
              mountPath: /run/exportarr
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ $name }}-config
        - name: library
          hostPath:
            path: /mnt/Media
            type: Directory
        - name: data
          hostPath:
            path: /mnt/Data
            type: Directory
        - name: backblaze
          hostPath:
            path: /mnt/Backblaze
            type: Directory
        - name: legacy-config
          hostPath:
            path: {{ $legacyConfigPath }}
            type: Directory
        {{- if $exporterEnabled }}
        - name: exporter-api-key
          emptyDir: {}
        {{- end }}
