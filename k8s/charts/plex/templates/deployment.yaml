apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups: [26, 303]
      initContainers:
        - name: prepare-runtime
          image: lscr.io/linuxserver/plex:1.43.5.11029-6bf8af3f0-ls329@sha256:8f655bad7dcbc5398a78f70a5af12600b4ed3424f901566ed1eaa6710e9e2334
          command: [/bin/sh, -ec]
          # s6 requires /run to be owned by its user, not only group-writable.
          args: [mkdir -p /runtime/run && chmod 0755 /runtime/run]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runtime
              mountPath: /runtime
      containers:
        - name: plex
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: lscr.io/linuxserver/plex:1.43.5.11029-6bf8af3f0-ls329@sha256:8f655bad7dcbc5398a78f70a5af12600b4ed3424f901566ed1eaa6710e9e2334
          env:
            - name: VERSION
              value: docker
            - name: TMPDIR
              value: /tmp/plex
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 32400
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              gpu.intel.com/i915: "1"
            limits:
              memory: 4Gi
              gpu.intel.com/i915: "1"
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
          readinessProbe:
            tcpSocket: {port: http}
          volumeMounts:
            - name: runtime
              mountPath: /run
              subPath: run
            - name: tmp
              mountPath: /tmp
            - name: transcode
              mountPath: /transcode
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /config/Library/Application Support/Plex Media Server/Cache
            - name: plugin-cache
              mountPath: /config/Library/Application Support/Plex Media Server/Plug-in Support/Caches
            - name: extensions
              mountPath: /config/Library/Application Support/Plex Media Server/Plug-ins
              subPath: Plug-ins
              readOnly: true
            - name: extensions
              mountPath: /config/Library/Application Support/Plex Media Server/Scanners/Series
              subPath: Scanners/Series
              readOnly: true
            - name: extensions
              mountPath: /config/Library/Application Support/Plex Media Server/Scanners/Music
              subPath: Scanners/Music
              readOnly: true
            - name: media
              mountPath: /mnt/Media/Anime
              subPath: Anime
              readOnly: true
            - name: media
              mountPath: /mnt/Media/Movies
              subPath: Movies
              readOnly: true
            - name: media
              mountPath: /mnt/Media/Music
              subPath: Music
              readOnly: true
            - name: media
              mountPath: /mnt/Media/Shows
              subPath: Shows
              readOnly: true
            - name: backblaze
              mountPath: /mnt/Backblaze/Anime
              subPath: Anime
              readOnly: true
            - name: backblaze
              mountPath: /mnt/Backblaze/Audiobooks
              subPath: Audiobooks
              readOnly: true
            - name: backblaze
              mountPath: /mnt/Backblaze/Movies
              subPath: Movies
              readOnly: true
            - name: backblaze
              mountPath: /mnt/Backblaze/Shows
              subPath: Shows
              readOnly: true
      volumes:
        - name: extensions
          hostPath:
            path: /etc/plex-extensions
            type: Directory
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir: {}
        - name: transcode
          emptyDir: {}
        - name: config
          hostPath:
            path: /mnt/Data/apps/plex
            type: Directory
        - name: cache
          hostPath:
            path: /mnt/Data/cache/plex
            type: Directory
        - name: plugin-cache
          hostPath:
            path: /mnt/Data/cache/plex-plugin-support
            type: Directory
        - name: media
          hostPath:
            path: /mnt/Media
            type: Directory
        - name: backblaze
          hostPath:
            path: /mnt/Backblaze
            type: Directory
