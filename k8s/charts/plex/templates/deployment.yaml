apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups: [44]
      containers:
        - name: plex
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          image: plexinc/pms-docker:1.43.3.10861-07dfddaeb@sha256:5bc1d13f48da6366f46aaf2a3ce1a6292897eadc1f8efcbbd7321d30e94f2ed4
          env:
            - name: ADVERTISE_IP
              value: https://plex.cute.haus:443
            - name: PLEX_GID
              value: "1000"
            - name: PLEX_UID
              value: "1000"
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 32400
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
          readinessProbe:
            tcpSocket: {port: http}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /config/Library/Application Support/Plex Media Server/Cache
            - name: plugin-cache
              mountPath: /config/Library/Application Support/Plex Media Server/Plug-in Support/Caches
            - name: media
              mountPath: /mnt/Media
            - name: backblaze
              mountPath: /mnt/Backblaze
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: config
          hostPath:
            path: /mnt/Data/apps/plex
            type: Directory
        - name: cache
          hostPath:
            path: /mnt/Data/cache/plex
            type: Directory
        - name: plugin-cache
          hostPath:
            path: /mnt/Data/cache/plex-plugin-support
            type: Directory
        - name: media
          hostPath:
            path: /mnt/Media
            type: Directory
        - name: backblaze
          hostPath:
            path: /mnt/Backblaze
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
