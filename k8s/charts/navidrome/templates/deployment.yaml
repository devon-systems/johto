apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        fsGroup: 1000
      containers:
        - name: navidrome
          image: deluan/navidrome:0.64.1@sha256:df22d661b8d0322c33754d999b567150df9e131a47ae53be71fed0154bf8cef5
          env:
            - name: ND_ADDRESS
              value: 0.0.0.0
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_DEFAULTTHEME
              value: Auto
            - name: ND_ENABLEUSEREDITING
              value: "false"
            - name: ND_LYRICSPRIORITY
              value: .lrc,nd-lyrics,.txt,embedded
            - name: ND_MUSICFOLDER
              value: /mnt/Media/Music
            - name: ND_PORT
              value: "4533"
            - name: ND_SUBSONICARTISTPARTICIPATIONS
              value: "true"
          ports:
            - containerPort: 4533
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /mnt/Media
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          hostPath:
            path: /mnt/Media
            type: Directory
