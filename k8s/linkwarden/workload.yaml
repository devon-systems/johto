apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkwarden
  template:
    metadata:
      labels:
        app: linkwarden
      annotations:
        security.aly.codes/exception-host-path: Archives are stored on Goldenrod and backed up by restic.
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-meilisearch
          image: ghcr.io/linkwarden/linkwarden:v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46
          command: [sh, -c]
          args:
            - |
              until curl --fail --silent --max-time 5 http://meilisearch:7700/health >/dev/null; do
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: linkwarden
          image: ghcr.io/linkwarden/linkwarden:v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: linkwarden-env
          env:
            - name: NEXTAUTH_URL
              value: https://linkwarden.cute.haus/api/v1/auth
            - name: NEXT_PUBLIC_DISABLE_REGISTRATION
              value: "true"
            - name: NEXT_PUBLIC_CREDENTIALS_ENABLED
              value: "false"
            - name: NEXT_PUBLIC_OIDC_ENABLED
              value: "true"
            - name: OIDC_CUSTOM_NAME
              value: Pocket ID
            - name: OIDC_WELLKNOWN_URL
              value: https://id.cute.haus/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: 68ecd828-d3c6-49b9-a2f9-b13364b71a18
            - name: STORAGE_FOLDER
              value: /data/data
            - name: MEILI_HOST
              value: http://meilisearch:7700
            - name: ARCHIVE_TAKE_COUNT
              value: "2"
            - name: ALLOW_PRIVATE_NETWORK_ACCESS
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: archives
              mountPath: /data/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: archives
          hostPath:
            path: /mnt/Data/apps/linkwarden
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: linkwarden
spec:
  selector:
    app: linkwarden
  ports:
    - name: http
      port: 80
      targetPort: http
