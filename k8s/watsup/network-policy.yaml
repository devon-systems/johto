apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: watsup
  namespace: websites
spec:
  podSelector:
    matchLabels:
      app: watsup
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: websites
          podSelector:
            matchLabels:
              app: watsup
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: uptime-kuma
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
              - 40.160.83.152/32
              - 51.81.32.154/32
              - 136.55.177.16/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
          podSelector:
            matchLabels:
              app: immich
      ports:
        - protocol: TCP
          port: 2283
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
          podSelector:
            matchLabels:
              app: nextcloud
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paperless
          podSelector:
            matchLabels:
              app: paperless
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: 10.254.2.3/32
      ports:
        - protocol: TCP
          port: 32400
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jellyfin
          podSelector:
            matchLabels:
              app.kubernetes.io/name: jellyfin
      ports:
        - protocol: TCP
          port: 8096
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: uptime-kuma
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ombi
          podSelector:
            matchLabels:
              app: ombi
      ports:
        - protocol: TCP
          port: 3579
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr
          podSelector:
            matchLabels:
              app.kubernetes.io/name: navidrome
      ports:
        - protocol: TCP
          port: 4533
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plex
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tautulli
      ports:
        - protocol: TCP
          port: 8181
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prowlarr
      ports:
        - protocol: TCP
          port: 9696
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr
          podSelector:
            matchLabels:
              app.kubernetes.io/name: radarr
      ports:
        - protocol: TCP
          port: 7878
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sonarr
      ports:
        - protocol: TCP
          port: 8989
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr
          podSelector:
            matchLabels:
              app.kubernetes.io/name: lidarr
      ports:
        - protocol: TCP
          port: 8686
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bazarr
      ports:
        - protocol: TCP
          port: 6767
