apiVersion: v1
kind: Namespace
metadata:
  name: websites
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watsup
  namespace: websites
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watsup
  template:
    metadata:
      labels:
        app: watsup
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watsup
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: ghcr.io/alyraffauf/watsup:latest@sha256:a6c521da6597e7c022beb1a86e1daaa8e002583accb1c22c2765b898293d0c50
          imagePullPolicy: IfNotPresent
          env:
            - name: WATSUP_CONFIG_PATH
              value: /run/configs/watsup.toml
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /run/configs/watsup.toml
              subPath: watsup.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: watsup-config
---
apiVersion: v1
kind: Service
metadata:
  name: watsup
  namespace: websites
spec:
  selector:
    app: watsup
  ports:
    - name: http
      port: 80
      targetPort: http
