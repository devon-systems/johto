apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: private-ingress
spec:
  statefulSet:
    pod:
      nodeSelector:
        kubernetes.io/hostname: goldenrod
      tailscaleContainer:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi
        env:
          - name: TS_EXPERIMENTAL_SERVICE_AUTO_ADVERTISEMENT
            value: "true"
      tolerations:
        - effect: NoSchedule
          key: johto.narwhal-snapper-ts.net/workload
          operator: Equal
          value: ingress
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: private-ingress
spec:
  proxyClass: private-ingress
  replicas: 1
  type: ingress
