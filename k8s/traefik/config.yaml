apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
    updateStrategy:
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    service:
      spec:
        externalTrafficPolicy: Local
    additionalArguments:
      - --accesslog.fields.queryparameters.defaultmode=drop
    logs:
      access:
        enabled: true
        format: json
    resources:
      requests:
        cpu: 25m
        memory: 192Mi
      limits:
        memory: 256Mi
