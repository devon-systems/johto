apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app: immich
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: websites
          podSelector:
            matchLabels:
              app: watsup
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: uptime-kuma
      ports:
        - protocol: TCP
          port: 2283
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: machine-learning
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app: machine-learning
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
          podSelector:
            matchLabels:
              app: immich
      ports:
        - protocol: TCP
          port: 3003
