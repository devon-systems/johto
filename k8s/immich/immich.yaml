apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: immich
spec:
  selector:
    app: immich
  ports:
    - name: http
      port: 2283
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: immich
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: machine-learning
  namespace: immich
spec:
  selector:
    app: machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
          args:
            [
              valkey-server,
              --save,
              "",
              --maxmemory,
              1gb,
              --maxmemory-policy,
              noeviction,
            ]
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket: { port: 6379 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6379 }
          readinessProbe:
            tcpSocket: { port: 6379 }
          resources:
            requests: { cpu: 25m, memory: 512Mi }
            limits: { memory: 1250Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: machine-learning
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine-learning
  template:
    metadata:
      labels:
        app: machine-learning
    spec:
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.2.2-openvino@sha256:6b2ad79e5eb47b94bb0ce187ce852442983a288ef49d964e58c9e20fb3bf3a48
          env:
            - { name: MACHINE_LEARNING_CACHE_FOLDER, value: /cache }
          ports:
            - { name: http, containerPort: 3003 }
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          startupProbe:
            tcpSocket: { port: http }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
          readinessProbe:
            tcpSocket: { port: http }
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: cache
          hostPath:
            path: /mnt/Data/cache/immich
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v3.2.2@sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea
          env:
            - { name: DB_DATABASE_NAME, value: immich }
            - { name: DB_HOSTNAME, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_USERNAME, value: immich }
            - { name: IMMICH_CONFIG_FILE, value: /etc/immich/config.json }
            - {
                name: IMMICH_MACHINE_LEARNING_URL,
                value: http://machine-learning:3003,
              }
            - { name: REDIS_DBINDEX, value: "4" }
            - { name: REDIS_HOSTNAME, value: valkey }
            - { name: TZ, value: America/New_York }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-env
                  key: DB_PASSWORD
          ports:
            - { name: http, containerPort: 2283 }
          resources:
            requests:
              cpu: 100m
              memory: 1500Mi
            limits:
              memory: 4Gi
          startupProbe:
            httpGet: { path: /api/server/ping, port: http }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/server/ping, port: http }
          readinessProbe:
            httpGet: { path: /api/server/ping, port: http }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/immich
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /mnt/Data/apps/immich
            type: Directory
        - name: config
          secret:
            secretName: immich-config
            items:
              - key: config.json
                path: config.json
