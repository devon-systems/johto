apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-shared
  namespace: cnpg-system
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-shared
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: happyview
          podSelector:
            matchLabels:
              app: happyview
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app: pocket-id
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
          podSelector:
            matchLabels:
              app: nextcloud
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ombi
          podSelector:
            matchLabels:
              app: ombi
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paperless
          podSelector:
            matchLabels:
              app: paperless
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pinepods
          podSelector:
            matchLabels:
              app: pinepods
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - bazarr
                  - lidarr
                  - prowlarr
                  - radarr
                  - sonarr
      ports:
        - protocol: TCP
          port: 5432
    # The operator and database peers also use the instance manager.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
              app.kubernetes.io/instance: cloudnative-pg
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg-shared
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: alloy
      ports:
        - protocol: TCP
          port: 9187
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
        - ipBlock:
            cidr: 10.254.2.2/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              cnpg.io/cluster: pg-shared
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
              - 40.160.83.152/32
              - 51.81.32.154/32
              - 136.55.153.136/32
      ports:
        - protocol: TCP
          port: 443
