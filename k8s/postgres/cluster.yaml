apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-shared
  namespace: cnpg-system
spec:
  affinity:
    nodeSelector:
      johto.narwhal-snapper-ts.net/workload: media
  # Recreating this Cluster restores from the current archive. Before that,
  # bump the WAL archiver serverName below so the new timeline does not write
  # into the archive it restores from.
  bootstrap:
    recovery:
      source: pg-shared-archive
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:d7a81cb5da3182d95d0da5fabfb9e484e375db899dcd54b684105f1e8966e9ca
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  managed:
    roles:
      - name: media
        login: true
        passwordSecret:
          name: pg-shared-app
      - name: nextcloud
        login: true
        passwordSecret:
          name: nextcloud-postgres
      - name: paperless
        login: true
        passwordSecret:
          name: paperless-postgres
      - name: ombi
        login: true
        passwordSecret:
          name: ombi-pg-creds
      - name: pocket-id
        login: true
        passwordSecret:
          name: pocket-id-pg-creds
      - name: pinepods
        login: true
        passwordSecret:
          name: pinepods-pg-creds
      - name: happyview
        login: true
        passwordSecret:
          name: happyview-pg-creds
  storage:
    size: 20Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-shared-backups
        serverName: pg-shared-recovered-20260829
  externalClusters:
    - name: pg-shared-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pg-shared-backups
          serverName: pg-shared-recovered-20260829
