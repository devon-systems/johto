apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hydrant
spec:
  podSelector:
    matchLabels:
      app: hydrant
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
