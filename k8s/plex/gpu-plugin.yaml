apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-gpu-plugin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.37.1@sha256:004641b2547d58f1eadce58473fa160ad71377de1eb588cf1f82832387bf3e33
          # Media workloads can share the GPU without making their pods privileged.
          args: [-shared-dev-num=3]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 40m
              memory: 45Mi
            limits:
              cpu: 100m
              memory: 115Mi
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
              readOnly: true
            - name: sysfs-drm
              mountPath: /sys/class/drm
              readOnly: true
            - name: kubelet-sockets
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdi
              mountPath: /var/run/cdi
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: sysfs-drm
          hostPath:
            path: /sys/class/drm
            type: Directory
        - name: kubelet-sockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
