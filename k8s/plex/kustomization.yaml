apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gpu-plugin.yaml
  - namespace.yaml
  - plex.yaml
  - tautulli.yaml
patches:
  # The upstream entrypoint drops privileges but does not set a private umask.
  - target:
      kind: Deployment
      name: tautulli
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tautulli
      spec:
        template:
          spec:
            containers:
              - name: tautulli
                command: [/bin/sh, -ec]
                args:
                  - |
                    umask 077
                    exec /app/start.sh python /app/Tautulli.py --datadir /config
