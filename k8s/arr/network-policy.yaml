# These policies exclude qBittorrent, which uses host networking.
# Olivine scrapes exporters from its WireGuard or Flannel host address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arr-applications
  namespace: arr
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - qbittorrent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
              tailscale.com/parent-resource-type: proxygroup
              tailscale.com/parent-resource: private-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: websites
          podSelector:
            matchLabels:
              app: watsup
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: uptime-kuma
      ports:
        - protocol: TCP
          port: 4533
        - protocol: TCP
          port: 5055
        - protocol: TCP
          port: 6767
        - protocol: TCP
          port: 7878
        - protocol: TCP
          port: 8686
        - protocol: TCP
          port: 8989
        - protocol: TCP
          port: 9696
    - from:
        - ipBlock:
            cidr: 10.254.2.2/32
        - ipBlock:
            cidr: 10.42.0.0/32
      ports:
        - protocol: TCP
          port: 9708
        - protocol: TCP
          port: 9709
        - protocol: TCP
          port: 9710
        - protocol: TCP
          port: 9711
        - protocol: TCP
          port: 9712
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: servarr-integrations
  namespace: arr
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - bazarr
          - lidarr
          - prowlarr
          - radarr
          - sonarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - bazarr
                  - lidarr
                  - prowlarr
                  - radarr
                  - sonarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ombi
          podSelector:
            matchLabels:
              app: ombi
      ports:
        - protocol: TCP
          port: 6767
        - protocol: TCP
          port: 7878
        - protocol: TCP
          port: 8686
        - protocol: TCP
          port: 8989
        - protocol: TCP
          port: 9696
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arr
          podSelector:
            matchLabels:
              app: seerr
      ports:
        - protocol: TCP
          port: 7878
        - protocol: TCP
          port: 8989
