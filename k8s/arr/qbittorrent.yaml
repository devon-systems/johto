apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: arr
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
      annotations:
        security.aly.codes/exception-host-network:
          Peer traffic uses the media host network
          and its configured inbound ports.
        security.aly.codes/exception-host-path:
          Torrent state and shared media remain
          on Goldenrod's existing filesystems.
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: qbittorrent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls472@sha256:212b86dff59e3962b4082b5ef20a577e76c8f8527d2ab505cfa887b4bcecb0b0
          env:
            - name: PGID
              value: "100"
            - name: PUID
              value: "888"
            - name: UMASK
              value: "002"
            - name: TORRENTING_PORT
              value: "6881"
            - name: TZ
              value: America/New_York
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: webui
              containerPort: 8080
            - name: torrent-tcp
              containerPort: 6881
              protocol: TCP
            - name: torrent-udp
              containerPort: 6881
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 8Gi
          startupProbe:
            tcpSocket:
              port: webui
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: webui
          livenessProbe:
            tcpSocket:
              port: webui
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /mnt/Media
      volumes:
        - name: config
          hostPath:
            path: /mnt/Data/apps/qbittorrent
            type: Directory
        - name: media
          hostPath:
            path: /mnt/Media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: arr
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: webui
