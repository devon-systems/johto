apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
  namespace: flux-system
spec:
  suspend: false
  chart:
    spec:
      chart: ./k8s/charts/servarr
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      version: 0.1.2
  interval: 30m
  releaseName: lidarr
  targetNamespace: arr
  values:
    app:
      name: lidarr
      port: 8686
      image: lscr.io/linuxserver/lidarr@sha256:9fddcf5c613361edfce390d4e6b7c364282e71e90a40ce7793077fed788f6e63
    database:
      logDatabase: lidarr_log
      mainDatabase: lidarr_main
    legacyConfig:
      path: /mnt/Data/legacy/servarr-seeds/lidarr
    exporter:
      enabled: true
      port: 9709
      image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
