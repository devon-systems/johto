apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hydrant-cute-haus
  namespace: hydrant
spec:
  dnsNames:
    - hydrant.cute.haus
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  secretName: hydrant-cute-haus-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hydrant
  namespace: hydrant
spec:
  ingressClassName: traefik
  rules:
    - host: hydrant.cute.haus
      http:
        # The management API is intentionally absent from the public ingress.
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: hydrant
                port:
                  name: http
          - path: /version
            pathType: Exact
            backend:
              service:
                name: hydrant
                port:
                  name: http
          - path: /stream
            pathType: Exact
            backend:
              service:
                name: hydrant
                port:
                  name: http
          - path: /stream/head
            pathType: Exact
            backend:
              service:
                name: hydrant
                port:
                  name: http
          - path: /xrpc/
            pathType: Prefix
            backend:
              service:
                name: hydrant
                port:
                  name: http
  tls:
    - hosts:
        - hydrant.cute.haus
      secretName: hydrant-cute-haus-tls
