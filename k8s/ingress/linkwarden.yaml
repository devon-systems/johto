apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkwarden-cute-haus
  namespace: linkwarden
spec:
  dnsNames:
    - linkwarden.cute.haus
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  secretName: linkwarden-cute-haus-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkwarden
  namespace: linkwarden
spec:
  ingressClassName: traefik
  rules:
    - host: linkwarden.cute.haus
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkwarden
                port:
                  name: http
  tls:
    - hosts:
        - linkwarden.cute.haus
      secretName: linkwarden-cute-haus-tls
