apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
      annotations:
        security.aly.codes/exception-host-port: Existing LAN access uses Goldenrod's port 8083.
        security.aly.codes/exception-host-path:
          The book library and application state
          remain on Goldenrod's backed-up storage.
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calibre-web
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: lscr.io/linuxserver/calibre-web:0.6.27-ls404@sha256:80b2a77b5925441c76607619fd406694570a50a0e32c229198dbb39e72da6fed
          env:
            - name: DOCKER_MODS
              value: linuxserver/mods:universal-calibre
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 8083
              # Keep the reader's HTTP endpoint on Goldenrod's LAN address.
              hostIP: 192.168.1.138
              hostPort: 8083
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: custom-init
              mountPath: /custom-cont-init.d
              readOnly: true
            - name: config
              mountPath: /config
            - name: library
              mountPath: /books
      volumes:
        - name: custom-init
          configMap:
            name: calibre-web-init
            defaultMode: 0555
        - name: config
          hostPath:
            path: /mnt/Data/apps/calibre-web/config
            type: DirectoryOrCreate
        - name: library
          hostPath:
            path: /mnt/Data/apps/calibre-web/books
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  selector:
    app: calibre-web
  ports:
    - name: http
      port: 8083
      targetPort: http
