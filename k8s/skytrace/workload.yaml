apiVersion: apps/v1
kind: Deployment
metadata:
  name: skytrace
  namespace: websites
  labels:
    app: skytrace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skytrace
  template:
    metadata:
      labels:
        app: skytrace
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: skytrace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: ghcr.io/alyraffauf/skytrace:latest@sha256:bf5ba5867fd975e2c4081235b5cf346bd4ff3a33d8c7945437dd88a35b33f3a3
          env:
            - name: SKYTRACE_IGNORE_NO_UNAUTHENTICATED
              value: "true"
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: skytrace
  namespace: websites
spec:
  selector:
    app: skytrace
  ports:
    - name: http
      port: 80
      targetPort: http
