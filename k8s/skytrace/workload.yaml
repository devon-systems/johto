apiVersion: apps/v1
kind: Deployment
metadata:
  name: skytrace
  namespace: websites
  labels:
    app: skytrace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skytrace
  template:
    metadata:
      labels:
        app: skytrace
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: skytrace
          image: ghcr.io/alyraffauf/skytrace:latest@sha256:855ba05f8e10a12aaf936a40eb889ee2446b4c9b50848fdb4a9c61e9e4784913
          env:
            - name: SKYTRACE_IGNORE_NO_UNAUTHENTICATED
              value: "true"
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: skytrace
  namespace: websites
spec:
  selector:
    app: skytrace
  ports:
    - name: http
      port: 80
      targetPort: http
