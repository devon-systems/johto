apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: albyhub
  namespace: alby
spec:
  podSelector:
    matchLabels:
      app: albyhub
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
              tailscale.com/parent-resource-type: proxygroup
              tailscale.com/parent-resource: private-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: websites
          podSelector:
            matchLabels:
              app: watsup
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: uptime-kuma
      ports:
        - protocol: TCP
          port: 8080
