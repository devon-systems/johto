apiVersion: v1
kind: Namespace
metadata:
  name: alby
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: albyhub
  namespace: alby
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: albyhub
  template:
    metadata:
      labels:
        app: albyhub
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      terminationGracePeriodSeconds: 300
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: albyhub
          image: ghcr.io/getalby/hub:v1.24.3@sha256:906e54e4c14b1508d5566271331135fcd1fe9b86ea3bf6e42502f2de6c3c2b41
          env:
            - name: WORK_DIR
              value: /data/albyhub
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /mnt/Data/apps/albyhub
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: albyhub
  namespace: alby
spec:
  selector:
    app: albyhub
  ports:
    - name: http
      port: 80
      targetPort: http
