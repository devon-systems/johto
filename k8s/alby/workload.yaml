apiVersion: apps/v1
kind: Deployment
metadata:
  name: albyhub
  namespace: alby
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: albyhub
  template:
    metadata:
      labels:
        app: albyhub
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      terminationGracePeriodSeconds: 300
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: albyhub
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          image: ghcr.io/getalby/hub:v1.24.4@sha256:ac82a3b2a94de92f3f168fab5b41c48f4316ad864cad6afdba2068beb229a2da
          env:
            - name: WORK_DIR
              value: /data/albyhub
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /mnt/Data/apps/albyhub
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: albyhub
  namespace: alby
spec:
  selector:
    app: albyhub
  ports:
    - name: http
      port: 80
      targetPort: http
