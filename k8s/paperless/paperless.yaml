apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector: { app: paperless }
  ports: [{ name: http, port: 80, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: paperless
spec:
  selector: { app: valkey }
  ports: [{ port: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: tika
  namespace: paperless
spec:
  selector: { app: tika }
  ports: [{ port: 9998 }]
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: paperless
spec:
  selector: { app: gotenberg }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: valkey, namespace: paperless }
spec:
  replicas: 1
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      nodeSelector: { johto.narwhal-snapper-ts.net/workload: media }
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
          args:
            [valkey-server, --maxmemory, 1gb, --maxmemory-policy, volatile-lru]
          startupProbe:
            tcpSocket: { port: 6379 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6379 }
          readinessProbe:
            tcpSocket: { port: 6379 }
          resources:
            requests: { cpu: 25m, memory: 512Mi }
            limits: { memory: 1250Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tika, namespace: paperless }
spec:
  replicas: 1
  selector: { matchLabels: { app: tika } }
  template:
    metadata: { labels: { app: tika } }
    spec:
      nodeSelector: { johto.narwhal-snapper-ts.net/workload: media }
      containers:
        - name: tika
          image: apache/tika:3.3.1.0-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
          startupProbe:
            tcpSocket: { port: 9998 }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9998 }
          readinessProbe:
            tcpSocket: { port: 9998 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gotenberg, namespace: paperless }
spec:
  replicas: 1
  selector: { matchLabels: { app: gotenberg } }
  template:
    metadata: { labels: { app: gotenberg } }
    spec:
      nodeSelector: { johto.narwhal-snapper-ts.net/workload: media }
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
          startupProbe:
            httpGet: { path: /health, port: 3000 }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: paperless, namespace: paperless }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: paperless } }
  template:
    metadata: { labels: { app: paperless } }
    spec:
      enableServiceLinks: false
      nodeSelector: { johto.narwhal-snapper-ts.net/workload: media }
      securityContext: { fsGroup: 1000 }
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
          envFrom: [{ secretRef: { name: paperless-env } }]
          env:
            # The Service is intentionally named `paperless`; explicitly set
            # the application port so Kubernetes' legacy service variables
            # cannot override it.
            - { name: PAPERLESS_PORT, value: "8000" }
            - { name: PAPERLESS_ACCOUNT_DEFAULT_GROUP, value: users }
            - { name: PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL, value: https }
            - { name: PAPERLESS_ADMIN_MAIL, value: alyraffauf@fastmail.com }
            - { name: PAPERLESS_ADMIN_USER, value: alyraffauf }
            - {
                name: PAPERLESS_APPS,
                value: allauth.socialaccount.providers.openid_connect,
              }
            - { name: PAPERLESS_CONSUMER_DELETE, value: "true" }
            - { name: PAPERLESS_DBHOST, value: pg-shared-rw.cnpg-system.svc }
            - { name: PAPERLESS_DBNAME, value: paperless }
            - { name: PAPERLESS_DBPORT, value: "5432" }
            - { name: PAPERLESS_DBUSER, value: paperless }
            - { name: PAPERLESS_OCR_LANGUAGE, value: eng }
            - { name: PAPERLESS_OCR_PAGES, value: "2" }
            - {
                name: PAPERLESS_PROXY_SSL_HEADER,
                value: '["HTTP_X_FORWARDED_PROTO", "https"]',
              }
            - { name: PAPERLESS_REDIS, value: redis://valkey:6379/0 }
            - { name: PAPERLESS_SOCIAL_AUTO_SIGNUP, value: "True" }
            - { name: PAPERLESS_TASK_WORKERS, value: "1" }
            - { name: PAPERLESS_TIKA_ENABLED, value: "1" }
            - { name: PAPERLESS_TIKA_ENDPOINT, value: http://tika:9998 }
            - {
                name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT,
                value: http://gotenberg:3000,
              }
            - { name: PAPERLESS_URL, value: https://paperless.cute.haus }
            - { name: PAPERLESS_CONSUMPTION_DIR, value: /paperless/consume }
            - { name: PAPERLESS_DATA_DIR, value: /paperless/data }
            - { name: PAPERLESS_MEDIA_ROOT, value: /paperless/media }
            - { name: PAPERLESS_TIME_ZONE, value: America/New_York }
            - { name: PAPERLESS_USE_X_FORWARD_HOST, value: "true" }
            - { name: PAPERLESS_USE_X_FORWARD_PORT, value: "true" }
            - { name: USERMAP_GID, value: "1000" }
            - { name: USERMAP_UID, value: "1000" }
          ports: [{ containerPort: 8000 }]
          startupProbe:
            tcpSocket: { port: 8000 }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8000 }
          readinessProbe:
            tcpSocket: { port: 8000 }
          resources:
            requests: { cpu: 100m, memory: 1Gi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /paperless/data }
            - { name: consume, mountPath: /paperless/consume }
            - { name: media, mountPath: /paperless/media }
      volumes:
        - {
            name: data,
            hostPath: { path: /mnt/Data/apps/paperless/data, type: Directory },
          }
        - {
            name: consume,
            hostPath:
              { path: /mnt/Data/apps/paperless/consume, type: Directory },
          }
        - {
            name: media,
            hostPath: { path: /mnt/Data/apps/paperless/media, type: Directory },
          }
