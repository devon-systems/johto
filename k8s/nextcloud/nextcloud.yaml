apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  selector:
    app: nextcloud
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: nextcloud
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: collabora
  namespace: nextcloud
spec:
  selector:
    app: collabora
  ports:
    - name: http
      port: 9980
      targetPort: 9980
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
          args:
            [
              valkey-server,
              --save,
              "",
              --maxmemory,
              256mb,
              --maxmemory-policy,
              volatile-lru,
            ]
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket: { port: 6379 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6379 }
          readinessProbe:
            tcpSocket: { port: 6379 }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collabora
  template:
    metadata:
      labels:
        app: collabora
    spec:
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: collabora
          image: docker.io/collabora/code:latest@sha256:379b8f1fc955dd6d01ba24adf61d1b177048ddaae179ae8c1e6a6342daccb282
          env:
            - name: DONT_GEN_SSL_CERT
              value: "true"
            - name: aliasgroup1
              value: https://nextcloud\.cute\.haus
            - name: extra_params
              value: --o:ssl.enable=false --o:ssl.termination=true
            - name: server_name
              value: collabora.cute.haus
          ports:
            - containerPort: 9980
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
          startupProbe:
            tcpSocket: { port: 9980 }
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9980 }
          readinessProbe:
            tcpSocket: { port: 9980 }
          securityContext:
            capabilities:
              add: [MKNOD]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        fsGroup: 33
      containers:
        - name: nextcloud
          image: docker.io/library/nextcloud:34-apache@sha256:0c74fb931e7e5115c833b3cab8d1eb2a4894ff95cd5fa2e84124ac9d3e1fea09
          command: [/bin/sh, -ec]
          args:
            - |
              config=/var/www/html/config/config.php
              if [ -f "$config" ]; then
                if grep -Fq "'dbhost' => 'postgres'" "$config"; then
                  sed -i \
                    -e "s/'dbhost' => 'postgres'/'dbhost' => 'pg-shared-rw.cnpg-system.svc'/" \
                    -e "s/'host' => 'nextcloud-valkey'/'host' => 'valkey'/" \
                    "$config"
                elif ! grep -Fq "'dbhost' => 'pg-shared-rw.cnpg-system.svc'" "$config"; then
                  echo "unexpected Nextcloud database host" >&2
                  exit 1
                fi

                sed -i \
                  -e "s/'hostname' => 'host.docker.internal'/'hostname' => '10.254.2.3'/" \
                  -e "s/'hostname' => '10.254.0.1'/'hostname' => '10.254.2.3'/" \
                  "$config"
              fi
              exec /entrypoint.sh apache2-foreground
          envFrom:
            - secretRef:
                name: nextcloud-env
          env:
            - { name: APACHE_DISABLE_REWRITE_IP, value: "1" }
            - { name: MAIL_DOMAIN, value: aly.social }
            - { name: MAIL_FROM_ADDRESS, value: admin }
            - { name: NEXTCLOUD_ADMIN_USER, value: alyraffauf }
            - { name: NEXTCLOUD_TRUSTED_DOMAINS, value: nextcloud.cute.haus }
            - { name: OBJECTSTORE_S3_AUTOCREATE, value: "false" }
            - { name: OBJECTSTORE_S3_BUCKET, value: aly-nextcloud }
            - { name: OBJECTSTORE_S3_HOST, value: 10.254.2.3 }
            - { name: OBJECTSTORE_S3_PORT, value: "3900" }
            - { name: OBJECTSTORE_S3_REGION, value: garage }
            - { name: OBJECTSTORE_S3_SSL, value: "false" }
            - { name: OBJECTSTORE_S3_USEPATH_STYLE, value: "true" }
            - { name: OVERWRITECLIURL, value: https://nextcloud.cute.haus }
            - { name: OVERWRITEHOST, value: nextcloud.cute.haus }
            - { name: OVERWRITEPROTOCOL, value: https }
            - { name: PHP_MEMORY_LIMIT, value: 512M }
            - { name: PHP_UPLOAD_LIMIT, value: 10G }
            - { name: POSTGRES_DB, value: nextcloud }
            - { name: POSTGRES_HOST, value: pg-shared-rw.cnpg-system.svc }
            - { name: POSTGRES_USER, value: nextcloud }
            - { name: REDIS_HOST, value: valkey }
            - { name: REDIS_HOST_PORT, value: "6379" }
            - { name: SMTP_AUTHTYPE, value: LOGIN }
            - { name: SMTP_HOST, value: smtp.resend.com }
            - { name: SMTP_NAME, value: resend }
            - { name: SMTP_PORT, value: "465" }
            - { name: SMTP_SECURE, value: ssl }
            - { name: TRUSTED_PROXIES, value: 10.42.0.0/16 }
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          startupProbe:
            httpGet: { path: /status.php, port: 80 }
            failureThreshold: 180
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /status.php, port: 80 }
          readinessProbe:
            exec:
              command:
                - php
                - -r
                - |
                  $response = @file_get_contents('http://127.0.0.1/status.php');
                  $status = json_decode($response === false ? '' : $response, true);
                  exit(is_array($status)
                    && ($status['installed'] ?? false) === true
                    && ($status['maintenance'] ?? true) === false
                    && ($status['needsDbUpgrade'] ?? true) === false ? 0 : 1);
            timeoutSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /var/www/html
        - name: cron
          image: docker.io/library/nextcloud:34-apache@sha256:0c74fb931e7e5115c833b3cab8d1eb2a4894ff95cd5fa2e84124ac9d3e1fea09
          command: [/bin/sh, -ec]
          args:
            [
              "while true; do php -f /var/www/html/cron.php || true; sleep 60; done",
            ]
          envFrom:
            - secretRef:
                name: nextcloud-env
          env:
            - { name: POSTGRES_DB, value: nextcloud }
            - { name: POSTGRES_HOST, value: pg-shared-rw.cnpg-system.svc }
            - { name: POSTGRES_USER, value: nextcloud }
            - { name: REDIS_HOST, value: valkey }
            - { name: REDIS_HOST_PORT, value: "6379" }
          securityContext:
            runAsUser: 33
            runAsGroup: 33
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      volumes:
        - name: html
          hostPath:
            path: /mnt/Data/apps/nextcloud/html
            type: DirectoryOrCreate
