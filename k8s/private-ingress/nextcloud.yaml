apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-johto
  namespace: nextcloud
  annotations:
    tailscale.com/proxy-group: private-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - nextcloud
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud
                port:
                  name: http
