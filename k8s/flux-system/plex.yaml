apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plex
  namespace: flux-system
spec:
  dependsOn:
    - name: intel-gpu-plugin
    - name: namespaces
  suspend: false
  interval: 10m
  retryInterval: 1m
  path: ./k8s/plex
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
