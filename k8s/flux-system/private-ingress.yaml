apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: private-ingress
  namespace: flux-system
spec:
  dependsOn:
    - name: alby
    - name: audiobookshelf
    - name: arr
    - name: calibre-web
    - name: forgejo
    - name: pinepods
    - name: plex
    - name: searxng
    - name: skytrace
    - name: tailscale-private-ingress
  interval: 10m
  path: ./k8s/private-ingress
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
