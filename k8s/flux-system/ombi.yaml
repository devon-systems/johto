apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ombi
  namespace: flux-system
spec:
  dependsOn:
    - name: postgres
    - name: secrets
  interval: 10m
  retryInterval: 1m
  path: ./k8s/ombi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
