apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress
  namespace: flux-system
spec:
  dependsOn:
    - name: letsencrypt
    - name: plex
    - name: paperless
    - name: nextcloud
    - name: immich
    - name: uptime-kuma
    - name: watsup
    - name: ombi
    - name: pocket-id
    - name: happyview
    - name: hydrant
  interval: 10m
  retryInterval: 1m
  path: ./k8s/ingress
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
