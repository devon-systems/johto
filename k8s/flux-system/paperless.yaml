apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
  namespace: flux-system
spec:
  suspend: false
  dependsOn:
    - name: cnpg
    - name: postgres
    - name: secrets
  interval: 10m
  retryInterval: 1m
  path: ./k8s/paperless
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
