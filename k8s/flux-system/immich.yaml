apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  suspend: false
  dependsOn:
    - name: intel-gpu-plugin
    - name: secrets
  interval: 10m
  retryInterval: 1m
  path: ./k8s/immich
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
