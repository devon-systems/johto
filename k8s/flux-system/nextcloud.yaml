apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  suspend: false
  dependsOn:
    - name: cnpg
    - name: postgres
    - name: secrets
  interval: 10m
  path: ./k8s/nextcloud
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 20m
  wait: true
