apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
      annotations:
        security.aly.codes/exception-host-path: Media, configuration, and
          transcode cache reside on Goldenrod.
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups: [26, 303]
      containers:
        - name: jellyfin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          # Version and digest are set in kustomization.yaml.
          image: jellyfin/jellyfin
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.narwhal-snapper.ts.net
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 8096
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              gpu.intel.com/i915: "1"
            limits:
              memory: 4Gi
              gpu.intel.com/i915: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
            - name: backblaze
              mountPath: /backblaze
      volumes:
        - name: config
          hostPath:
            path: /mnt/Data/apps/jellyfin
            type: Directory
        - name: cache
          hostPath:
            path: /mnt/Data/cache/jellyfin
            type: Directory
        - name: media
          hostPath:
            path: /mnt/Media
            type: Directory
        - name: backblaze
          hostPath:
            path: /mnt/Backblaze
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
